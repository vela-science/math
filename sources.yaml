  vibemathed:
    source_id: source:vibemathed
    kind: attribution_registry
    url: https://vibemathed.com/api/dataset
    homepage: https://vibemathed.com
    publisher: Rasmus Lindahl (mrconter1)
    note: >-
      the community-curated record of mathematical problems first solved with AI
      assistance. What it originates is the curatorial judgment: that a given
      problem was solved this way, and that a moderator approved the entry
      saying so. The proofs are elsewhere, in the arXiv preprints and Lean
      repositories each entry links out to.

      Catalogue and dataset are CC BY 4.0, stated in the repository README and
      again in the `license` field of the response itself. The site's code is
      MIT and is not acquired here.

      Acquired from the live endpoint and not from
      github.com/mrconter1/vibemathed, whose `src/data/problems.json` is
      committed and would be pinnable. It would also be the wrong bytes. The
      README calls the database the source of truth and that file a seed and
      disaster-recovery snapshot refreshed after catalogue changes, and the
      export is lossy: checked 2026-08-07, the two agreed on all 509 entries,
      and the committed copy still dropped `kind` from every link along with the
      six fields the dataset serves beyond it.

      So the sha256 below names a retrieval, not a revision, and it will differ
      from the next one for reasons that are not the catalogue. The endpoint
      serves a cached render whose envelope carries a `generated` stamp inside
      the hashed bytes. Measured 2026-08-07 it re-rendered about every five
      minutes: three distinct digests inside twelve, while all 509 entries
      stayed byte-identical across every one of them. Locking it is still worth
      doing, because it records what was served at a moment nothing else
      records. Reading it as a pin is not, and a re-resolution that changes only
      this digest has observed nothing. The projection adapter therefore roots
      its records on the catalogue rather than on the envelope, and that root is
      the one that holds still.

      Two consequences, stated here so nobody has to rediscover them. `--check
      --refetch` can never be green for this entry: the digest recorded at
      generation is stale within minutes by construction, and the refetch will
      report it as though upstream had moved. And every regeneration of this
      lock churns this one entry whatever it was run for, so a lock diff touching
      an unrelated source will carry a `vibemathed` digest change alongside it,
      and a reviewer cannot tell that apart from the catalogue actually moving.
      Three regenerations on 2026-08-07 produced three digests, about twenty
      minutes apart, over an unchanged catalogue. The honest reading of a moved
      digest here is no reading at all; use the adapter's catalogue root, which
      moves only when an entry does.


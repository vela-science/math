name: formal-conjectures-phase-0

on:
  pull_request:
    paths:
      - ".github/workflows/formal-conjectures-phase-0.yml"
      - "evidence/formal-conjectures/**"
      - "methods/formal-conjectures/**"
      - "methods/review-provenance/**"
      - "methods/source-adapters/**"
      - "sources.yaml"
      - "sources.lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/formal-conjectures-phase-0.yml"
      - "evidence/formal-conjectures/**"
      - "methods/formal-conjectures/**"
      - "methods/review-provenance/**"
      - "methods/source-adapters/**"
      - "sources.yaml"
      - "sources.lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the offline Phase 0 packet
        run: |
          set -euo pipefail
          python3 -B evidence/formal-conjectures/audit-pilot/test_phase_0.py
          python3 -B evidence/formal-conjectures/audit-pilot/build_collection_readiness.py --check
          python3 -B evidence/formal-conjectures/audit-pilot/test_collection_readiness.py
          python3 -B evidence/formal-conjectures/conformance/test_do_not_collapse.py
          python3 -B methods/source-adapters/test_conformance.py
          python3 -B methods/review-provenance/test_review_methods.py
          python3 -B evidence/formal-conjectures/source-adapter/test_adapter.py
          python3 -B evidence/formal-conjectures/source-adapter/build.py --check
          python3 -B evidence/formal-conjectures/work-offers/proof-discharge/build.py --check
          python3 -B evidence/formal-conjectures/work-offers/proof-discharge/capture_result.py \
            --check \
            --output evidence/formal-conjectures/work-offers/results/erdos-887-proof-discharge-attempt-01
          python3 -B evidence/formal-conjectures/work-offers/proof-discharge/test_build.py
          python3 -B evidence/formal-conjectures/work-offers/build.py --check
          python3 -B evidence/formal-conjectures/work-offers/test_build.py
          python3 -B evidence/formal-conjectures/campaigns/build.py --check
          python3 -B evidence/formal-conjectures/campaigns/test_build.py
          python3 -B evidence/formal-conjectures/work-offers/execution/erdos-887-pr-1237-fidelity-repair/test_verify_binding.py
          python3 -B evidence/formal-conjectures/work-offers/results/erdos-887-pilot-02-current-binding/test_result.py
          while IFS= read -r -d '' document; do
            python3 -B -m json.tool "$document" >/dev/null
          done < <(find evidence/formal-conjectures methods/formal-conjectures methods/review-provenance methods/source-adapters -type f -name '*.json' -print0)
          test -z "$(find evidence/formal-conjectures methods/formal-conjectures methods/review-provenance methods/source-adapters -type d -name __pycache__ -print -quit)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Check committed patch whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$PUSH_BEFORE_SHA..$EVENT_SHA"
          else
            git show --check --format= "$EVENT_SHA"
          fi

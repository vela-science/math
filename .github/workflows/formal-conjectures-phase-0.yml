name: formal-conjectures-phase-0

on:
  pull_request:
    paths:
      - ".github/workflows/formal-conjectures-phase-0.yml"
      - "evidence/formal-conjectures/**"
      - "methods/formal-conjectures/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/formal-conjectures-phase-0.yml"
      - "evidence/formal-conjectures/**"
      - "methods/formal-conjectures/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Verify the offline Phase 0 packet
        run: |
          set -euo pipefail
          python3 -B evidence/formal-conjectures/audit-pilot/test_phase_0.py
          python3 -B evidence/formal-conjectures/conformance/test_do_not_collapse.py
          while IFS= read -r -d '' document; do
            python3 -B -m json.tool "$document" >/dev/null
          done < <(find evidence/formal-conjectures methods/formal-conjectures -type f -name '*.json' -print0)
          test -z "$(find evidence/formal-conjectures methods/formal-conjectures -type d -name __pycache__ -print -quit)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Check committed patch whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$PUSH_BEFORE_SHA..$EVENT_SHA"
          else
            git show --check --format= "$EVENT_SHA"
          fi

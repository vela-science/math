name: terminal-variant-evidence

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "evidence/erdos-321/external-workbench-return/**"
      - "evidence/erdos-321/terminal-variants/**"
      - "evidence/erdos-321/workbench-compatibility/**"
      - ".github/workflows/terminal-variant-evidence.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "README.md"
      - "evidence/erdos-321/external-workbench-return/**"
      - "evidence/erdos-321/terminal-variants/**"
      - "evidence/erdos-321/workbench-compatibility/**"
      - ".github/workflows/terminal-variant-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Acquire complete pinned source object stores
        env:
          SOURCE_ROOT: ${{ runner.temp }}/terminal-variant-sources
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_ROOT"
          git clone --no-tags https://github.com/williamjblair/lean-proofs.git "$SOURCE_ROOT/lean-proofs"
          git clone --no-tags https://github.com/leanprover-community/mathlib4.git "$SOURCE_ROOT/mathlib4"
          git clone --no-tags https://github.com/AlexKontorovich/PrimeNumberTheoremAnd.git "$SOURCE_ROOT/pnt"
          git clone --no-tags https://github.com/block/buzz.git "$SOURCE_ROOT/buzz"
          git -C "$SOURCE_ROOT/lean-proofs" cat-file -e a8c2872a27cf8d11cf6744ca4a2c5b49ace5fea0^{commit}
          git -C "$SOURCE_ROOT/mathlib4" cat-file -e fabf563a7c95a166b8d7b6efca11c8b4dc9d911f^{commit}
          git -C "$SOURCE_ROOT/pnt" cat-file -e a7eb3a8ae4bde79292fb5f04c32cd5ab6d8f226c^{commit}
          git -C "$SOURCE_ROOT/buzz" cat-file -e 397796c5f343db4251198f44505b1afebe88223f^{commit}
          git -C "$SOURCE_ROOT/buzz" checkout --detach 397796c5f343db4251198f44505b1afebe88223f

      - name: Verify rooted comparison and preregistration
        env:
          VELA_LEAN_PROOFS_REPO: ${{ runner.temp }}/terminal-variant-sources/lean-proofs
          VELA_MATHLIB_REPO: ${{ runner.temp }}/terminal-variant-sources/mathlib4
          VELA_PNT_REPO: ${{ runner.temp }}/terminal-variant-sources/pnt
          VELA_BUZZ_REPO: ${{ runner.temp }}/terminal-variant-sources/buzz
        run: |
          set -euo pipefail
          git remote set-url origin https://github.com/vela-science/math.git
          base=fdb23666e7b5385a62cc97c58086bc67bd4e7fa9
          git cat-file -e "${base}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          restricted_history="${RUNNER_TEMP}/restricted-standingbench-history"
          git log --format= --name-only "$base"..HEAD -- \
            evidence/erdos-321/standingbench >"$restricted_history"
          if test -s "$restricted_history"; then
            echo "restricted StandingBench paths entered main history" >&2
            exit 1
          fi
          expected="${RUNNER_TEMP}/terminal-variant-expected-paths"
          observed="${RUNNER_TEMP}/terminal-variant-observed-paths"
          cat >"$expected" <<'EOF'
          .github/workflows/terminal-variant-evidence.yml
          AGENTS.md
          README.md
          evidence/erdos-321/external-workbench-return/README.md
          evidence/erdos-321/external-workbench-return/return-contract.v0.1.json
          evidence/erdos-321/external-workbench-return/test_verify_return.py
          evidence/erdos-321/external-workbench-return/verify_return.py
          evidence/erdos-321/terminal-variants/README.md
          evidence/erdos-321/terminal-variants/build.py
          evidence/erdos-321/terminal-variants/comparison.v0.1.json
          evidence/erdos-321/terminal-variants/evidence_rooting.py
          evidence/erdos-321/terminal-variants/participant-packet.v0.1.json
          evidence/erdos-321/terminal-variants/plan.v0.1.json
          evidence/erdos-321/terminal-variants/reader-instrument.v0.1.json
          evidence/erdos-321/terminal-variants/reader_protocol.py
          evidence/erdos-321/terminal-variants/reader_protocol_test.py
          evidence/erdos-321/terminal-variants/reader_run.py
          evidence/erdos-321/terminal-variants/reader_run_test.py
          evidence/erdos-321/terminal-variants/reader_scorer.py
          evidence/erdos-321/terminal-variants/source-lock.v0.1.json
          evidence/erdos-321/terminal-variants/test_build.py
          evidence/erdos-321/workbench-compatibility/README.md
          evidence/erdos-321/workbench-compatibility/bun.lock
          evidence/erdos-321/workbench-compatibility/events.json
          evidence/erdos-321/workbench-compatibility/execution-evidence.json
          evidence/erdos-321/workbench-compatibility/nostr-verification.json
          evidence/erdos-321/workbench-compatibility/package.json
          evidence/erdos-321/workbench-compatibility/run-manifest.json
          evidence/erdos-321/workbench-compatibility/run.py
          evidence/erdos-321/workbench-compatibility/target-packet.json
          evidence/erdos-321/workbench-compatibility/test_run.py
          evidence/erdos-321/workbench-compatibility/test_verify.py
          evidence/erdos-321/workbench-compatibility/verify-nostr.mjs
          evidence/erdos-321/workbench-compatibility/verify.py
          evidence/erdos-321/workbench-compatibility/workbench-note.json
          evidence/erdos-321/workbench-compatibility/workbench-result.json
          EOF
          # This workflow owns the terminal-evidence tranche, not every later
          # file added to main. Keep the closed inventory check scoped to the
          # surfaces above so independent evidence packages cannot invalidate
          # an otherwise unchanged retained experiment.
          git diff --name-only "$base"...HEAD -- \
            .github/workflows/terminal-variant-evidence.yml \
            AGENTS.md \
            README.md \
            evidence/erdos-321/external-workbench-return \
            evidence/erdos-321/terminal-variants \
            evidence/erdos-321/workbench-compatibility \
            | LC_ALL=C sort >"$observed"
          diff -u "$expected" "$observed"
          test -z "$(git diff --name-only "$base"...HEAD -- .vela records continuity)"
          test -z "$(git diff --name-only "$base"...HEAD -- \
            methods ':(exclude,glob)methods/formal-conjectures/**')"
          python3 -B evidence/erdos-321/terminal-variants/build.py \
            --lean-proofs-repo "$VELA_LEAN_PROOFS_REPO" \
            --mathlib-repo "$VELA_MATHLIB_REPO" \
            --pnt-repo "$VELA_PNT_REPO" \
            --check
          bundle_root="$(python3 -B evidence/erdos-321/terminal-variants/build.py \
            --lean-proofs-repo "$VELA_LEAN_PROOFS_REPO" \
            --mathlib-repo "$VELA_MATHLIB_REPO" \
            --pnt-repo "$VELA_PNT_REPO" \
            --check --print-root)"
          test "$(grep -Foc "$bundle_root" README.md)" -eq 1
          python3 -B evidence/erdos-321/terminal-variants/test_build.py
          python3 -B evidence/erdos-321/terminal-variants/reader_protocol_test.py
          python3 -B evidence/erdos-321/terminal-variants/reader_run_test.py
          python3 -B evidence/erdos-321/external-workbench-return/test_verify_return.py
          workbench_root="sha256:0271f0d9d385b2c834ccf461a8e004165ad579e6b12f2ab2f2f44e824e68f625"
          test "$(grep -Foc "$workbench_root" README.md)" -eq 1
          python3 -B evidence/erdos-321/workbench-compatibility/verify.py --expected-root "$workbench_root"
          python3 -B evidence/erdos-321/workbench-compatibility/test_run.py --buzz-repo "$VELA_BUZZ_REPO"
          python3 -B evidence/erdos-321/workbench-compatibility/test_verify.py
          bun install --cwd evidence/erdos-321/workbench-compatibility --frozen-lockfile
          bun run --cwd evidence/erdos-321/workbench-compatibility verify-nostr.mjs \
            >"${RUNNER_TEMP}/nostr-verification.actual.json"
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path("evidence/erdos-321/workbench-compatibility/nostr-verification.json").read_text())
          actual = json.loads(Path("${{ runner.temp }}/nostr-verification.actual.json").read_text())
          assert actual == expected
          PY
          test -z "$(find evidence/erdos-321/terminal-variants -type d -name __pycache__ -print -quit)"
          test -z "$(find evidence/erdos-321/external-workbench-return -type d -name __pycache__ -print -quit)"
          test -z "$(find evidence/erdos-321/workbench-compatibility -type d -name __pycache__ -print -quit)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check "$base"...HEAD
